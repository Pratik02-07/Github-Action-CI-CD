name: deploy node js application on Ec2 instance

'on':
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via ssh
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_SERVER_IP }}
          username: ${{ secrets.EC2_USER }}   
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            cd /home/ubuntu/Github-Action-CI-CD
            git pull origin main
            if command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              COMPOSE_CMD="docker compose"
            fi

            $COMPOSE_CMD up -d --build
            $COMPOSE_CMD ps

            # Fail the workflow if any app container is not running.
            if ! $COMPOSE_CMD ps --status running | grep -q app; then
              $COMPOSE_CMD logs --no-color --tail=200
              exit 1
            fi
